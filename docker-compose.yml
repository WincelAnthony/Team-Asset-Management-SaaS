name: assetforge

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: ['pnpm', '--filter', '@assetforge/web', 'dev']
    environment:
      NODE_ENV: development
      API_URL: http://api:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ['pnpm', '--filter', '@assetforge/api', 'dev']
    environment:
      NODE_ENV: development
      PORT: 4000
      WEB_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-assetforge}:${POSTGRES_PASSWORD:-assetforge_local_only}@postgres:5432/${POSTGRES_DB:-assetforge}?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-assetforge}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-assetforge_local_only_change_me}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-assetforge-assets}
    ports:
      - '127.0.0.1:4000:4000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health/live').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ['pnpm', '--filter', '@assetforge/worker', 'dev']
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-assetforge}:${POSTGRES_PASSWORD:-assetforge_local_only}@postgres:5432/${POSTGRES_DB:-assetforge}?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-assetforge}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-assetforge_local_only_change_me}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-assetforge-assets}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assetforge}
      POSTGRES_USER: ${POSTGRES_USER:-assetforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assetforge_local_only}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4.11-alpine3.21
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-10-15T17-29-55Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-assetforge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-assetforge_local_only_change_me}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS http://localhost:9000/minio/health/ready || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  minio-data:
